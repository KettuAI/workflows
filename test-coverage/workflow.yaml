format: 1
name: Increase test coverage
description: Find the untested code that matters most, write tests that fail when it breaks, and have another agent check they test something real.
when: Use when important existing code has gaps in its tests and you need to verify that new tests catch failures.
locales:
  zh-CN:
    name: 补测试
    description: 找出最要紧却没有测试的代码，写出它一坏就会失败的测试，再换一个 Agent 检查这些测试是不是真的在测东西。
    when: 现有关键代码缺少测试，需要补齐并验证测试能发现故障时使用。
    steps:
      gaps: 找缺口
      write-tests: 写测试
      review: 审查测试
      bugs: 你来决定
    outcomes:
      gaps:
        Done: 完成
      write-tests:
        Done: 完成
        Found bugs: 发现 bug
      review:
        Approved: 通过
        Changes needed: 需要修改
      bugs:
        Keep writing tests: 继续写测试
        Stop here: 到此为止
send_back_limit: 3
steps:
  - id: gaps
    name: Find gaps
    hand_in: document
    you_review: true
    hint: Reading code and coverage; a mid-size model is usually enough.
    prompt: |
      Find what is worth testing in the part of the project the requirement names, or the whole
      project if it names none. Run the existing tests with coverage if the project supports it.
      Rank the untested or weakly tested code by what a bug there would cost: security checks,
      stored data and migrations, parsing and protocols, money and permissions first; simple
      wiring and styling last. Change no file.

      Write a document artifact with the ranked list, for each the behaviors a test should pin
      and the kind of test (unit, integration), and what you suggest leaving untested and why.

      If you were sent back, address every point you were given and every comment on the
      document.
    outcomes:
      - name: Done
        to: write-tests

  - id: write-tests
    name: Write tests
    hand_in: note
    hint: Test writing; a mid-size model is usually enough, a strong one for tricky logic.
    prompt: |
      Write the tests the approved list asks for, in the project's existing test style and
      tools. Each test must check a behavior, not repeat the implementation. For each new test,
      break the code it covers on purpose, see the test fail, and put the code back. Tests must
      be deterministic: no sleeps, real network or order dependence. Do not change code under
      test. Run the whole suite and commit the tests on the current branch.

      If a test shows a real bug, do not fix it: leave the test out of the commit, describe the
      bug and report Found bugs. If you were sent back, fix every point you were given first. In
      your note, list what is now covered.
    outcomes:
      - name: Done
        to: review
      - name: Found bugs
        to: bugs

  - id: review
    name: Review tests
    hand_in: outcome
    review_of: [write-tests]
    hint: Another agent than the one that wrote the tests when one is available.
    prompt: |
      Review the new tests on this branch. Check that each one fails when the behavior it names
      breaks (try a few by breaking the code and putting it back), that none is tautological,
      flaky or tied to implementation details, and that the code under test was not changed.
      Run the whole suite. Do not change any file.

      Report Approved when they hold. Report Changes needed otherwise, listing every problem
      with the test and what is wrong.
    outcomes:
      - name: Approved
        end: done
      - name: Changes needed
        to: write-tests

  - id: bugs
    name: Decide on bugs
    by: you
    prompt: The tests found real bugs, described in the note. Keep writing tests and fix the bugs separately, or stop here?
    outcomes:
      - name: Keep writing tests
        to: write-tests
      - name: Stop here
        end: done
